apiVersion: v1
kind: Pod
metadata:
  name: hami-bd006-train
  namespace: test
  labels:
    job-type: plan3-bd006
spec:
  restartPolicy: Never
  containers:
    - name: trainer
      image: 192.168.6.123:30080/loiht2/train-tester:v1.0
      imagePullPolicy: IfNotPresent
      command: ["/bin/bash", "-lc"]
      args:
        - |
          echo "=== hami-bd006-train: tiny memory OOM test ===" && date
          python - <<'PY'
          import ctypes, os, time, traceback
          CUDA_SUCCESS = 0
          CUdevice = ctypes.c_int; CUcontext = ctypes.c_void_p
          CUdeviceptr = ctypes.c_uint64; CUresult = ctypes.c_int
          def load_libcuda():
              for name in ("libcuda.so.1", "libcuda.so"):
                  try: return ctypes.CDLL(name)
                  except OSError: pass
              return None
          try:
              import torch
              torch.cuda.set_device(0); torch.cuda.init()
              dev = torch.empty(1, device="cuda")
              print("CUDA initialized", flush=True)
              # Alloc 100 MiB tensors until OOM
              tensors = []
              for i in range(1000):
                  try:
                      t = torch.empty(100 * 1024 * 1024 // 4, device="cuda", dtype=torch.float32)
                      tensors.append(t)
                      print(f"alloc={i} total_MiB={(i+1)*100}", flush=True)
                  except RuntimeError as e:
                      print(f"torch OOM at alloc={i}: {e}", flush=True)
                      break
              # Also try direct Driver API alloc to trip hami_oom uretprobe
              cuda = load_libcuda()
              if cuda:
                  alloc_fn = cuda.cuMemAlloc_v2
                  alloc_fn.restype = CUresult
                  alloc_fn.argtypes = [ctypes.POINTER(CUdeviceptr), ctypes.c_size_t]
                  ptr = CUdeviceptr(0)
                  rc = alloc_fn(ctypes.byref(ptr), 256 * 1024 * 1024)
                  print(f"driver cuMemAlloc_v2 256MiB rc={rc}", flush=True)
          except Exception as exc:
              traceback.print_exc()
          finally:
              print("=== finished ===", flush=True)
          PY
      env:
        - name: NCCL_DEBUG
          value: "WARN"
      resources:
        claims:
          - name: hami-gpu
  resourceClaims:
    - name: hami-gpu
      resourceClaimName: hami-tiny-memory-gpu
