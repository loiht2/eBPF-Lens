# helm-values.yaml

image:
  registry: docker.io
  repository: yourDockerHubUsername/beyla
  tag: gpu-dev-v1

# preset: application sets hostPID: true — required for /proc PID discovery
preset: application

privileged: true

service:
  enabled: true
  port: 9400

volumes:
  # Proc FS — for PID → container → pod mapping
  - name: proc
    hostPath:
      path: /proc
  # vGPU Cache FS — HAMi shared-region files (only-HAMi DRA mode).
  # Used ONLY for gpu_uuid labelling (reads uuids[0] from {uuid}.cache).
  # Optional: with hostPID + privileged the agent can also reach these via
  # /proc/1/root. Not needed at all in only-MIG mode.
  - name: vgpu-cache
    hostPath:
      path: /usr/local/vgpu/containers

volumeMounts:
  - name: proc
    mountPath: /proc
    readOnly: true
  - name: vgpu-cache
    mountPath: /var/lib/vgpu/containers
    readOnly: true

# Schedule only on GPU nodes; tolerate the nvidia.com/gpu taint
nodeSelector:
  nvidia.com/gpu.present: "true"

tolerations:
  - key: nvidia.com/gpu
    operator: Exists
    effect: NoSchedule

config:
  data:
    ebpf:
      instrument_cuda: on
    prometheus_export:
      port: 9400
      path: /metrics
      instrumentations:
        - "*"
    attributes:
      kubernetes:
        enable: true